# O app mobile (apps/mobile) usa npm e fica fora deste workspace de propósito:
# o EAS Build instala as dependências dele de forma independente.
packages:
  - "apps/api"
  - "packages/*"

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - argon2
  - esbuild
  - prisma
