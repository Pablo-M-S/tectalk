name: EAS Update

# Publica as mudanças de JavaScript do app direto nos aparelhos (OTA),
# sem gerar um APK novo. Só dispara quando algo em apps/mobile muda.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Publicar atualização
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'Atualização manual' }}
        run: eas update --branch preview --environment preview --message "$MESSAGE" --non-interactive
